name: CI

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: windows-latest
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pytest==9.1.1
      - run: python -m pytest tests/

  package:
    name: package
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so `git describe --tags` can stamp addon_version.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install SCons==4.10.1 Markdown==3.10.2
      - run: scons
      - run: python .github/scripts/verify_artifact.py
      - uses: actions/upload-artifact@v7
        with:
          name: nvda-addon
          path: "*.nvda-addon"
          if-no-files-found: error

  release:
    name: release
    if: github.event_name == 'release'
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: nvda-addon
      - uses: softprops/action-gh-release@v2
        with:
          files: "*.nvda-addon"
